# Local full stack:  docker compose up --build
#
#   http://localhost:3000        frontend (Next.js)
#   http://localhost:8000/docs   API (FastAPI / Swagger)
#   http://localhost:6333/dashboard  Qdrant dashboard
#
# On first start the one-shot `seed` service indexes the bundled sample dataset
# (data/sample/papers.jsonl, ~1,400 papers) — or data/papers.jsonl if you built a larger one.
# Containers talk to each other by service name (http://qdrant:6333); only the browser uses localhost.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  seed:
    build: ./backend
    command: ["python", "/workspace/scripts/seed_database.py", "--if-empty"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-arxiv_papers}
      PYTHONPATH: /app
      EMBEDDING_THREADS: "" # use all cores for bulk indexing
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
    depends_on:
      - qdrant
    restart: "no"

  backend:
    build: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-arxiv_papers}
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Used by the *browser*, which runs on the host, so localhost is correct here.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
